# Refined, agent-readable work items.
#
# Written by /work-plan. Implementers start here, never from a historical planning
# document. Acceptance criteria must be strong enough to make that possible.
#
# Valid type values:     {{WORK_TYPES}}
# Valid priority values: {{PRIORITIES}}
#
# Valid status values:
#   needs-refinement  ready  needs-audit  shippable-candidate
#   in-progress  needs-test  blocked  done  deferred
#
#   blocked  MUST carry blocked_on naming the dependency.
#   deferred MUST NOT carry blocked_on — if there is a dependency, it is blocked.
#   done     carries done_in; completion is never encoded in the status value.
#
#   done_in holds release versions. A spike bumps no version, so a completed spike
#   records SPIKE: <ITEM-ID> instead — never a date and never free text, since this
#   field is parsed as a version everywhere else. The document is derived from the ID
#   as {{SPIKES_PATH}}/<ITEM-ID>.md rather than stored, so it survives that path moving.
#
#   Provenance: exactly one of source_request / source_release is set. source_request
#   names the human-facing ask this was refined from; source_release names the release
#   that found it, for work no one asked for. An item with source_release and no
#   source_request is upkeep or scope that arrived on its own — which is the point of
#   keeping them as separate keys rather than one free-text field.
#
#   parked_since / reviewed track review pressure on blocked and deferred items. reviewed
#   is incremented and REPLACED at each re-check, never appended to; at 5 the next review
#   asks for a decision instead of restating the item.
#
# Fields: id, source_request, source_release, title, type, capability, status, priority,
# confidence, summary, acceptance, remaining, dependencies, suggested_agents, evidence,
# done_in, blocked_on, parked_since, reviewed. Full schema and field-by-field semantics:
# work-model skill.

model_version: 1

