# Work-management manifest — the single source of project facts.
# Commands, skills, and generated agents all read from this file. If you're
# about to record a project fact in a command or agent file instead, it
# belongs here.
#
# (required) fields must be set. Optional fields may be omitted or left
# null — commands degrade gracefully when they're absent.

# Schema version this manifest is written against. Every command checks it
# before reading anything else and refuses to run on a mismatch, rather than
# risk misreading a field that has moved.
#
# Don't hand-edit this. `/work-init --upgrade` migrates an older manifest and
# bumps it for you.
model_version: 3

# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------
project:
  # (required) Replaces every hardcoded project name in agent prompts.
  name: EXAMPLE
  # (required) One line. Goes into every agent's system prompt.
  description: a short one-line description of what this project is
  # (required) The product truth source that planned work is checked against.
  primary_reference: docs/product/PRD.md
  # (optional) File of invariant domain rules (calculations, business
  # constants, naming laws). Generated agents link to it rather than
  # restating it.
  domain_rules: null

# ---------------------------------------------------------------------------
# Paths. All relative to the repository root. Set to null if not used.
# ---------------------------------------------------------------------------
paths:
  work: docs/work                 # (required) requests.md, backlog.yml, active-release.md
  spikes: docs/spikes             # (required) one file per spike work item
  architecture: docs/architecture # optional
  decisions: docs/decisions       # optional — ADRs
  product: docs/product           # optional
  changelog: CHANGELOG.md         # optional — set null if the project has none

# ---------------------------------------------------------------------------
# Identifiers
# ---------------------------------------------------------------------------
ids:
  request_prefix: REQ
  work_prefix: WORK
  pad: 3                          # REQ-001 with pad 3; REQ-0001 with pad 4

# ---------------------------------------------------------------------------
# Taxonomy. Statuses are fixed by the model, not configurable — see the
# work-model skill. Types and priorities are per project.
#
# request_types / work_types must be supersets of whatever already appears in
# requests.md / backlog.yml, or validation reports drift.
# ---------------------------------------------------------------------------
taxonomy:
  request_types: [feature, bug, improvement, maintenance, chore, spike]
  work_types: [feature, bug, improvement, maintenance, chore, audit, docs, security, refactor, spike]
  priorities: [critical, high, medium, low]

# ---------------------------------------------------------------------------
# Version control.
#
# system: none skips every VCS step rather than failing it — no command asks
# for a commit, a tag, or a clean tree. It's a supported configuration, not a
# degraded one, but it removes your undo path and makes the changelog the
# only durable release record. See the README's "Version control is
# optional" section before choosing it.
#
# When system is none, set owner and branching to null rather than leaving
# their defaults — an unset default reads like a decision nobody made.
# ---------------------------------------------------------------------------
vcs:
  system: git      # git | none
  owner: command   # who runs commit/tag/push: command | human
  branching: none  # none | branch | pr

# ---------------------------------------------------------------------------
# Versioning — deliberately separate from vcs and release. A project can be
# versioned without being under version control, or vice versa; see the
# README's "Versioning and version control are separate concerns" section.
#
# /work-release writes the version at the START of a release, right after
# scope is approved, so everything built during the session already carries
# the new number.
# ---------------------------------------------------------------------------
version:
  scheme: semver-v # semver-v (v1.2.3) | semver (1.2.3) | date (2026.07.27) | none
  owner: human     # who assigns the number: human | command

  # File holding the version of record. Required when vcs.system is none —
  # with no tag, there's nowhere else for the version to live. Recognised
  # shapes: package.json, pyproject.toml, Cargo.toml, *.csproj, or a plain
  # VERSION file.
  file: null

  # Other version-bearing files a release should keep in step with `file`
  # (e.g. each package.json in a monorepo). Leave empty to have releases
  # touch only `file` — that's a deliberate choice, not an oversight.
  mirrors: []

# ---------------------------------------------------------------------------
# Release mechanics — what happens around shipping, beyond versioning and
# version control. The release coordinator is a PERSONA /work-release adopts
# for the session, never a sub-agent; when vcs.owner is command, this is who
# does the VCS work.
# ---------------------------------------------------------------------------
release:
  # required | optional | none. Treat as required when vcs.system is none —
  # it's then the only narrative record of what shipped.
  changelog: required

  # Automated pipeline, if any. /work-init detects a workflow file where one
  # exists; a `definition` path is read at release time so /work-release
  # reports what will actually happen, rather than a description that goes
  # stale. Leave the whole block null if there's no pipeline.
  pipeline:
    definition: null # e.g. .github/workflows/release.yml
    trigger: null    # tag-push | branch-push | manual
    does: null        # one line, only when no definition file exists

  # Ordered manual steps the human performs after the release is out.
  deploy_steps: []

# ---------------------------------------------------------------------------
# Testing. This manifest does not define what needs coverage — that's a
# codebase fact and belongs in the project's own technical docs. Point at
# that document instead of restating it here.
# ---------------------------------------------------------------------------
testing:
  # Path to the project's testing policy doc, or null if none — verification
  # then relies entirely on each release's own bar.
  policy_document: null
  # Agent name from agents[] that owns testing, or false if implementers
  # write their own tests.
  agent: false

# ---------------------------------------------------------------------------
# Agent roster. /work-init generates .claude/agents/<name>.md from these
# entries; scope-enforcement tables are DERIVED from `owns` — never
# hand-write them.
#
# Ownership must not overlap: after `excludes` is applied, every path
# belongs to exactly one agent. Overlap is a hard stop — two agents claiming
# one path produces two scope tables that each tell the other to keep out.
#
# `excludes` is for a legitimate carve-out (e.g. a test role owning test
# files inside a developer's tree). Declare it on BOTH sides — the developer
# excludes the paths, the test role owns them — so it's machine-checkable
# rather than a convention nothing enforces.
#
# Glob patterns are permitted in owns and excludes.
# ---------------------------------------------------------------------------
agents:
  - name: product-manager
    role: Product Manager
    model: sonnet
    owns: [docs/product, docs/work]
    excludes: []
    reads: []
    stack: null
    consult_before: []

  - name: principal-architect
    role: Principal Architect
    model: opus
    owns: [docs/architecture, docs/decisions, docs/spikes]
    excludes: []
    reads: []
    stack: null
    # Triggers that require this agent to be engaged BEFORE implementers start.
    consult_before:
      - a data-model or schema change
      - a new dependency not already declared in the project manifest
      - a new cross-cutting pattern or architectural concern

  # One entry per implementer. `stack` optionally points at a file describing
  # that area's tech and conventions, so the generated prompt stays short and
  # portable. /work-init extracts this from hand-written agent files during
  # adoption.
  - name: EXAMPLE-implementer
    role: EXAMPLE Developer
    model: sonnet
    owns: []
    # Paths inside `owns` that belong to another agent instead. An excluded
    # path owned by nobody is a gap, not a carve-out — /work-init treats it
    # as an error.
    excludes: []
    reads: []
    stack: null
    consult_before: []

  # Worked example of a carve-out. Uncomment and adapt if a dedicated test role
  # owns test files living inside the implementers' source trees. Note the
  # matching `excludes` entries required on each implementer above.
  #
  # - name: test-engineer
  #   role: Test Engineer
  #   model: sonnet
  #   owns:
  #     - "**/*.test.ts"
  #     - "backend/src/test"
  #     - "**/vitest.config.ts"
  #   excludes: []
  #   reads: [backend, frontend, shared]
  #   stack: docs/development/testing-stack.md
  #   consult_before: []

# ---------------------------------------------------------------------------
# Agents that deliberately do NOT exist on this project.
#
# Declare these when a role is a common default that agents would otherwise
# invent (test-engineer, devops-engineer, release-manager). /work-init writes
# a short tombstone agent file for each, which stops work being routed into a
# role that has no owner.
# ---------------------------------------------------------------------------
inactive_agents: []
#  - name: test-engineer
#    reason: Testing is targeted and written by the implementing developer.
#    redirect_to: the implementing developer

# ---------------------------------------------------------------------------
# Responsibilities held by the human, not any agent. Generated agents refuse
# these and redirect to the human.
# ---------------------------------------------------------------------------
human_owns:
  - approving proposed release scope
  - verifying the build before release
